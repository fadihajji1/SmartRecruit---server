server:
  port: 8091
spring:
  application:
    name: candidate-ai-service
  datasource:
    url: ${CANDIDATE_AI_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/smartrecruit_candidate}
    username: ${POSTGRES_USER:smartrecruit}
    password: ${POSTGRES_PASSWORD:smartrecruit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET}
    issuer: ${IDENTITY_JWT_ISSUER:smartrecruit-identity}
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_CV_BUCKET:smartrecruit-cvs}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
