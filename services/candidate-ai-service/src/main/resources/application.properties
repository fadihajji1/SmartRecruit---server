spring.application.name=candidate-ai-service
server.port=${SERVER_PORT:8091}
spring.datasource.url=${CANDIDATE_AI_DB_URL:jdbc:postgresql://localhost:5435/candidate_db}
spring.datasource.username=${CANDIDATE_AI_DB_USERNAME:smartrecruit}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
spring.kafka.consumer.group-id=candidate-ai-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:smartrecruit-identity}
candidate-ai.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9002}
candidate-ai.storage.access-key=${MINIO_ROOT_USER:minioadmin}
candidate-ai.storage.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
candidate-ai.storage.bucket=${MINIO_CV_BUCKET:smartrecruit-cvs}
candidate-ai.events.topic=${DOMAIN_EVENTS_TOPIC:smartrecruit.domain-events}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
