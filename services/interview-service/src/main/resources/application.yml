server:
  port: 8093
spring:
  application:
    name: interview-service
  datasource:
    url: ${INTERVIEW_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/smartrecruit_interview}
    username: ${POSTGRES_USER:smartrecruit}
    password: ${POSTGRES_PASSWORD:smartrecruit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET}
    issuer: ${IDENTITY_JWT_ISSUER:smartrecruit-identity}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
