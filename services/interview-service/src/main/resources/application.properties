spring.application.name=interview-service
server.port=${SERVER_PORT:8093}
spring.datasource.url=${INTERVIEW_DB_URL:jdbc:postgresql://localhost:5437/interview_db}
spring.datasource.username=${INTERVIEW_DB_USERNAME:smartrecruit}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
interview.events.topic=${DOMAIN_EVENTS_TOPIC:smartrecruit.domain-events}
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:smartrecruit-identity}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
