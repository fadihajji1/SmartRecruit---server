spring.application.name=interview-service
spring.datasource.url=${INTERVIEW_DB_URL:jdbc:postgresql://localhost:5437/interview_db}
spring.datasource.username=${INTERVIEW_DB_USERNAME:smartrecruit}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${INTERVIEW_SERVICE_PORT:8083}
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:smartrecruit-identity}
springdoc.swagger-ui.path=/swagger-ui.html
