spring.application.name=interview-service
spring.datasource.url=${INTERVIEW_DB_URL:jdbc:postgresql://localhost:5437/interview_db}
spring.datasource.username=${INTERVIEW_DB_USERNAME:smartrecruit}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${SERVER_PORT:${INTERVIEW_SERVICE_PORT:8093}}
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:smartrecruit-identity}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
interview.events.topic=${DOMAIN_EVENTS_TOPIC:smartrecruit.domain-events}
# Recruitment Service, used to verify that the application belongs to the recruiter
interview.recruitment.base-url=${RECRUITMENT_SERVICE_URL:http://localhost:8090}
# Feign client "recruitment-service": explicit timeouts (ms); retry and circuit breaker are set in code
spring.cloud.openfeign.client.config.recruitment-service.connect-timeout=2000
spring.cloud.openfeign.client.config.recruitment-service.read-timeout=5000
spring.cloud.openfeign.client.config.recruitment-service.logger-level=basic
# In-platform interview rooms (WebRTC). Add a TURN server for candidates behind strict company networks.
interview.rooms.opens-minutes-before=${INTERVIEW_ROOM_OPENS_MINUTES_BEFORE:60}
interview.rooms.closes-minutes-after=${INTERVIEW_ROOM_CLOSES_MINUTES_AFTER:120}
interview.rooms.allowed-origins=${INTERVIEW_ROOM_ALLOWED_ORIGINS:*}
interview.rooms.stun-urls=${INTERVIEW_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
interview.rooms.turn-url=${INTERVIEW_TURN_URL:}
interview.rooms.turn-username=${INTERVIEW_TURN_USERNAME:}
interview.rooms.turn-credential=${INTERVIEW_TURN_CREDENTIAL:}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
