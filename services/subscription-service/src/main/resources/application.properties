spring.application.name=subscription-service
server.port=${SERVER_PORT:8092}
spring.datasource.url=${SUBSCRIPTION_DB_URL:jdbc:postgresql://localhost:5436/subscription_db}
spring.datasource.username=${SUBSCRIPTION_DB_USERNAME:smartrecruit}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
identity.jwt.secret=${JWT_SECRET}
identity.jwt.issuer=${JWT_ISSUER:smartrecruit-identity}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
