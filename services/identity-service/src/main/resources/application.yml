spring:
  application:
    name: identity-service

  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/smartrecruit_identity}
    username: ${IDENTITY_DB_USERNAME:smartrecruit}
    password: ${IDENTITY_DB_PASSWORD:${POSTGRES_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${IDENTITY_SERVICE_PORT:8082}

identity:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:smartrecruit-identity}
    expiration: PT1H

  admin:
    password: ${IDENTITY_ADMIN_PASSWORD:}

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
      access-key: ${MINIO_ROOT_USER}
      secret-key: ${MINIO_ROOT_PASSWORD}
      bucket: ${MINIO_BUCKET:smartrecruit-private}

springdoc:
  swagger-ui:
    path: /swagger-ui.html