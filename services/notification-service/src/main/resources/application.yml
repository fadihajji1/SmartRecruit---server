server:
  port: 8094
spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  datasource:
    url: ${NOTIFICATION_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/smartrecruit_notification}
    username: ${POSTGRES_USER:smartrecruit}
    password: ${POSTGRES_PASSWORD:smartrecruit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET}
    issuer: ${IDENTITY_JWT_ISSUER:smartrecruit-identity}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
