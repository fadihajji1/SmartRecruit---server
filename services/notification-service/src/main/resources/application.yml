server:
  port: 8094
spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/smartrecruit_notification}
    username: ${POSTGRES_USER:smartrecruit}
    password: ${POSTGRES_PASSWORD:smartrecruit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET:01234567890123456789012345678901}
    issuer: ${IDENTITY_JWT_ISSUER:smartrecruit-identity}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
