spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5438/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:smartrecruit}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}

identity:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:smartrecruit-identity}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
