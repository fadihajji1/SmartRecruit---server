server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/recruiters/**,/api/v1/admin/users/**,/api/v1/admin/recruiters/**

            - id: recruitment-service
              uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/jobs/**,/api/v1/applications/**,/api/v1/businesses/**,/api/v1/recruiter/businesses/**,/api/v1/recruiter/jobs/**,/api/v1/recruiter/applications/**,/api/v1/candidate/applications/**,/api/v1/admin/businesses/**

            - id: candidate-ai-service
              uri: ${CANDIDATE_AI_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/candidate/cvs,/api/v1/candidate/cvs/**,/api/v1/candidate/recommendations,/api/v1/candidate/recommendations/**,/api/v1/cvs/**,/api/v1/ai/**

            - id: subscription-service
              uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/v1/subscriptions/plans,/api/v1/candidate/subscription,/api/v1/candidate/subscription/**,/api/v1/recruiter/subscription,/api/v1/recruiter/subscription/**,/api/v1/admin/subscription,/api/v1/admin/subscription/**

            - id: interview-service
              uri: ${INTERVIEW_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/v1/interviews/**,/api/v1/recruiter/interviews,/api/v1/recruiter/interviews/**,/api/v1/candidate/interviews,/api/v1/candidate/interviews/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8094}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8095}
              predicates:
                - Path=/api/v1/analytics/**,/api/v1/recruiter/analytics/**

        globalcors:
          cors-configurations:
            '[/**]':
              allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
              allowedMethods:
                - GET
                - POST
                - PATCH
                - PUT
                - DELETE
                - OPTIONS
              allowedHeaders: "*"
              exposedHeaders:
                - Content-Disposition
              allowCredentials: true

identity:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:smartrecruit-identity}
