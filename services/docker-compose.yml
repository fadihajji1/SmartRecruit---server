services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: smartrecruit, POSTGRES_PASSWORD: smartrecruit}
    ports: ["5432:5432"]
    volumes: ["./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  kafka:
    image: bitnami/kafka:3.6
    environment: {KAFKA_CFG_NODE_ID: 1, KAFKA_CFG_PROCESS_ROLES: "broker,controller", KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093", KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093", KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092", KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT", KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER}
    ports: ["9092:9092"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
