server:
  port: 8090
spring:
  application:
    name: recruitment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${RECRUITMENT_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/smartrecruit_recruitment}
    username: ${POSTGRES_USER:smartrecruit}
    password: ${POSTGRES_PASSWORD:smartrecruit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET}
    issuer: ${IDENTITY_JWT_ISSUER:smartrecruit-identity}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
