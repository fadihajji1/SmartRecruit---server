name: smartrecruit

services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin


  identity-db:
    image: postgres:17-alpine
    container_name: smartrecruit-identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_identity
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_identity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  recruitment-db:
    image: postgres:17-alpine
    container_name: smartrecruit-recruitment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_recruitment
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - recruitment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_recruitment"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  candidate-db:
    image: postgres:17-alpine
    container_name: smartrecruit-candidate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_candidate
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5435:5432"
    volumes:
      - candidate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_candidate"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  subscription-db:
    image: postgres:17-alpine
    container_name: smartrecruit-subscription-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_subscription
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5436:5432"
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_subscription"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  interview-db:
    image: postgres:17-alpine
    container_name: smartrecruit-interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_interview
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5437:5432"
    volumes:
      - interview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_interview"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  notification-db:
    image: postgres:17-alpine
    container_name: smartrecruit-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_notification
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5438:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_notification"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  analytics-db:
    image: postgres:17-alpine
    container_name: smartrecruit-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrecruit_analytics
      POSTGRES_USER: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5439:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrecruit -d smartrecruit_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: smartrecruit-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    container_name: smartrecruit-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9093:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: smartrecruit-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: smartrecruit-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: smartrecruit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

volumes:
  pgadmin-data:
  identity_postgres_data:
  recruitment_postgres_data:
  candidate_postgres_data:
  subscription_postgres_data:
  interview_postgres_data:
  notification_postgres_data:
  analytics_postgres_data:
  redis_data:
  kafka_data:
  minio_data: