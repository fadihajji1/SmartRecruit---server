name: smartrecruit

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  restart: unless-stopped
  environment: &postgres-environment
    POSTGRES_USER: smartrecruit
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  healthcheck:
    test:
      - CMD-SHELL
      - pg_isready -U smartrecruit -d "$$POSTGRES_DB"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: smartrecruit-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  identity-db:
    <<: *postgres-common
    container_name: smartrecruit-identity-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data

  recruitment-db:
    <<: *postgres-common
    container_name: smartrecruit-recruitment-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: recruitment_db
    ports:
      - "5434:5432"
    volumes:
      - recruitment_postgres_data:/var/lib/postgresql/data

  candidate-db:
    <<: *postgres-common
    container_name: smartrecruit-candidate-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: candidate_db
    ports:
      - "5435:5432"
    volumes:
      - candidate_postgres_data:/var/lib/postgresql/data

  subscription-db:
    <<: *postgres-common
    container_name: smartrecruit-subscription-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: subscription_db
    ports:
      - "5436:5432"
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data

  interview-db:
    <<: *postgres-common
    container_name: smartrecruit-interview-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: interview_db
    ports:
      - "5437:5432"
    volumes:
      - interview_postgres_data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres-common
    container_name: smartrecruit-notification-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: notification_db
    ports:
      - "5438:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

  analytics-db:
    <<: *postgres-common
    container_name: smartrecruit-analytics-postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: analytics_db
    ports:
      - "5439:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartrecruit-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    container_name: smartrecruit-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9093:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: smartrecruit-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: smartrecruit-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: smartrecruit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/identity-service
        APP_JAR: identity-service
    container_name: smartrecruit-identity-service
    restart: unless-stopped
    environment:
      IDENTITY_SERVICE_PORT: 8082
      IDENTITY_DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      IDENTITY_DB_USERNAME: smartrecruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-smartrecruit-identity}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartrecruit-private}
    ports:
      - "8082:8082"
    depends_on:
      identity-db:
        condition: service_healthy
      minio:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/api-gateway
        APP_JAR: api-gateway
    container_name: smartrecruit-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-smartrecruit-identity}
      IDENTITY_SERVICE_URL: http://identity-service:8082
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8080
      CANDIDATE_AI_SERVICE_URL: http://candidate-ai-service:8080
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8080
      INTERVIEW_SERVICE_URL: http://interview-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      ANALYTICS_SERVICE_URL: http://analytics-service:8080
    ports:
      - "8080:8080"
    depends_on:
      - identity-service

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"

volumes:
  pgadmin_data:
  identity_postgres_data:
  recruitment_postgres_data:
  candidate_postgres_data:
  subscription_postgres_data:
  interview_postgres_data:
  notification_postgres_data:
  analytics_postgres_data:
  redis_data:
  kafka_data:
  minio_data:
