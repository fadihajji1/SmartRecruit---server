# TEMPLATE ONLY. Never commit real values. Create the Secret from your own values instead, for example:
#
#   kubectl -n smartrecruit create secret generic smartrecruit-secrets \
#     --from-literal=identity-jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=postgres-password='<strong password>' \
#     --from-literal=admin-password='<strong password>' \
#     --from-literal=minio-root-user='smartrecruit' \
#     --from-literal=minio-root-password='<strong password, 8+ characters>'
#
# This file is not listed in kustomization.yaml, so `kubectl apply -k` never applies it.
apiVersion: v1
kind: Secret
metadata:
  name: smartrecruit-secrets
  namespace: smartrecruit
type: Opaque
stringData:
  identity-jwt-secret: change-me-to-a-random-value-of-at-least-32-characters
  postgres-password: change-me
  admin-password: change-me
  minio-root-user: smartrecruit
  minio-root-password: change-me-too
