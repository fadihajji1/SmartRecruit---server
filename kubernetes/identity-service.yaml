# Accounts, sign-in (JWT issuer), recruiter approval and employment proofs (MinIO).
# One replica: it creates the first administrator at start-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app: identity-service
    app.kubernetes.io/part-of: smartrecruit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        app.kubernetes.io/part-of: smartrecruit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: identity-service
          image: smartrecruit/identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: smartrecruit-config
          env:
            - name: IDENTITY_SERVICE_PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartrecruit-secrets
                  key: identity-jwt-secret
            - name: IDENTITY_DB_URL
              value: "jdbc:postgresql://postgres:5432/identity_db"
            - name: IDENTITY_DB_USERNAME
              value: "smartrecruit"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartrecruit-secrets
                  key: postgres-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartrecruit-secrets
                  key: admin-password
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: smartrecruit-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartrecruit-secrets
                  key: minio-root-password
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  labels:
    app: identity-service
    app.kubernetes.io/part-of: smartrecruit
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - name: http
      port: 8080
      targetPort: http
