# Non-secret settings shared by every service (each service only reads the keys it knows).
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartrecruit-config
  labels:
    app.kubernetes.io/part-of: smartrecruit
data:
  JWT_ISSUER: smartrecruit-identity
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DOMAIN_EVENTS_TOPIC: smartrecruit.domain-events
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: smartrecruit-private
  MINIO_CV_BUCKET: smartrecruit-cvs
  # first administrator, created by the Identity Service at start-up (password comes from the Secret)
  ADMIN_EMAIL: admin@smartrecruit.tn
  # the public address of the web app, allowed to call the API from the browser
  CORS_ALLOWED_ORIGINS: https://smartrecruit.example.com
  # let the JVM size its heap from the container memory limit
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
