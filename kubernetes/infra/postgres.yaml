# PostgreSQL for development clusters and self-hosted installs. Each service keeps its own database
# (database-per-service); the init script creates them on first start. With a managed PostgreSQL,
# delete this file from kustomization.yaml and point the *_DB_URL values at your server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/part-of: smartrecruit
data:
  01-databases.sql: |
    CREATE DATABASE recruitment_db;
    CREATE DATABASE candidate_db;
    CREATE DATABASE subscription_db;
    CREATE DATABASE interview_db;
    CREATE DATABASE notification_db;
    CREATE DATABASE analytics_db;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: smartrecruit
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: smartrecruit
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: smartrecruit
            - name: POSTGRES_DB
              value: identity_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartrecruit-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "smartrecruit", "-d", "identity_db"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 20
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: smartrecruit
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
